name: Listening Style Refresh

on:
  push:
    branches:
      - feat/listening-style-refresh

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/apply-listening-style-refresh.mjs
      - name: Copy Cambridge brand asset from Listening app
        run: curl -fsSL https://raw.githubusercontent.com/tobypottas-sketch/igcse-listening/main/cambridge-english-header.png -o cambridge-english-header.png
      - run: node --test tests/listening-style-refresh.test.mjs tests/practice-exam-mode.test.mjs
      - name: Commit generated Reading refresh
        run: |
          if git diff --quiet -- index.html cambridge-english-header.png; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html cambridge-english-header.png
          git commit -m "feat: align Reading styling with Listening app"
          git push
