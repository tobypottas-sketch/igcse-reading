name: Practice Exam Mode

on:
  push:
    branches:
      - feat/practice-exam-mode

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/practice-exam-mode.test.mjs
