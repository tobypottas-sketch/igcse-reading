name: Practice Exam Mode

on:
  push:
    branches:
      - feat/practice-exam-mode

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/apply-practice-exam-mode.mjs
      - run: node --test tests/practice-exam-mode.test.mjs
      - name: Commit generated app change
        run: |
          if git diff --quiet -- index.html; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: add reading practice and exam modes"
          git push
