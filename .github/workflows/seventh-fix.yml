name: Apply Seventh Audit Reading Fix
on:
  push:
    branches: [audit/seventh-hardening-20261015]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'Apply Audit #7 Reading scoring fix')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/seventh-hardening-20261015
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch Reading scorer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.index('function countMatchesFlexible(')
          brace=s.index('{',start)
          depth=0
          end=None
          for i in range(brace,len(s)):
              if s[i]=='{': depth+=1
              elif s[i]=='}':
                  depth-=1
                  if depth==0:
                      end=i+1
                      break
          if end is None: raise SystemExit('could not find end of countMatchesFlexible')
          new='''function countMatchesFlexible(givenList, answerList){
            const given = givenList.map(normalizeAnswerText).filter(Boolean);
            const accepted = answerList.map(normalizeAnswerText).filter(Boolean);
            const hasNegation = value => /(?:^|\\s)(?:not|never|no|without|cannot|can't|cant|isn't|isnt|wasn't|wasnt|didn't|didnt|won't|wont)(?:\\s|$)/.test(value);
            const phraseContained = (needle, haystack) => (` ${haystack} `).includes(` ${needle} `);
            const conceptMatch = (left, right) => {
              if(!left || !right) return false;
              if(left === right) return true;
              if(hasNegation(left) !== hasNegation(right)) return false;
              const shorter = left.length <= right.length ? left : right;
              const longer = left.length <= right.length ? right : left;
              if(!shorter.includes(' ') && shorter.length < 4) return false;
              return phraseContained(shorter, longer);
            };
            const answerMatch = (givenValue, acceptedValue) => {
              if(!givenValue || !acceptedValue) return false;
              if(givenValue === acceptedValue) return true;
              if(hasNegation(givenValue) !== hasNegation(acceptedValue)) return false;
              return phraseContained(acceptedValue, givenValue);
            };
            const concepts=[];
            accepted.forEach(a=>{
              const existing=concepts.find(group=>group.some(v=>conceptMatch(a,v)));
              if(existing) existing.push(a); else concepts.push([a]);
            });
            const usedGiven=new Set();
            let matches=0;
            concepts.forEach(group=>{
              for(let i=0;i<given.length;i++){
                if(usedGiven.has(i)) continue;
                if(group.some(a=>answerMatch(given[i],a))){
                  usedGiven.add(i);
                  matches++;
                  break;
                }
              }
            });
            return matches;
          }'''
          p.write_text(s[:start]+new+s[end:])
          PY
      - name: Verify full suite
        run: node --test tests/*.test.mjs
      - name: Commit fix
        run: |
          git config user.name "Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply Audit #7 Reading scoring fix"
          git push origin HEAD:audit/seventh-hardening-20261015
