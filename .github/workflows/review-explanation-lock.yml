name: Review Explanation Lock

on:
  push:
    branches:
      - fix/hide-review-explanations

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/fix-review-explanation-lock.mjs
      - run: node --test tests/review-explanation-lock.test.mjs tests/practice-exam-mode.test.mjs tests/listening-style-refresh.test.mjs
      - name: Commit generated fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: hide review explanations until reveal"
          git push
